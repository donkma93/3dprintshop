<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f10"/>
      <stop offset="45%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#0c0c0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e0a0"/>
      <stop offset="40%" stop-color="#c9a227"/>
      <stop offset="70%" stop-color="#8a6b14"/>
      <stop offset="100%" stop-color="#e8d48b"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d48b" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a67c1a" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#c9a227" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#e8d48b" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- isometric grid -->
  <g opacity=".12" stroke="#e8d48b" stroke-width="1">
    <path d="M0 700 L960 220 L1920 700"/>
    <path d="M0 820 L960 340 L1920 820"/>
    <path d="M0 940 L960 460 L1920 940"/>
    <path d="M200 1080 L960 700 L1720 1080"/>
    <path d="M-100 400 L860 -80"/>
    <path d="M200 400 L1160 -80"/>
    <path d="M500 400 L1460 -80"/>
    <path d="M800 400 L1760 -80"/>
    <path d="M1100 400 L1920 0"/>
    <path d="M1400 500 L1920 240"/>
  </g>

  <!-- floating gold cube (isometric) -->
  <g transform="translate(1280 280) scale(1.15)" filter="url(#soft)">
    <path d="M0 40 L70 0 L140 40 L70 80 Z" fill="url(#gold)" opacity=".95"/>
    <path d="M0 40 L70 80 L70 160 L0 120 Z" fill="#8a6b14" opacity=".9"/>
    <path d="M70 80 L140 40 L140 120 L70 160 Z" fill="#c9a227" opacity=".85"/>
  </g>

  <!-- smaller cubes -->
  <g transform="translate(1480 520) scale(.7)" opacity=".75">
    <path d="M0 40 L70 0 L140 40 L70 80 Z" fill="url(#gold)"/>
    <path d="M0 40 L70 80 L70 160 L0 120 Z" fill="#6f5610"/>
    <path d="M70 80 L140 40 L140 120 L70 160 Z" fill="#a67c1a"/>
  </g>
  <g transform="translate(1100 480) scale(.45) rotate(-12)" opacity=".55">
    <path d="M0 40 L70 0 L140 40 L70 80 Z" fill="#e8d48b"/>
    <path d="M0 40 L70 80 L70 160 L0 120 Z" fill="#8a6b14"/>
    <path d="M70 80 L140 40 L140 120 L70 160 Z" fill="#c9a227"/>
  </g>

  <!-- torus-like ring -->
  <g transform="translate(1500 200)" opacity=".5">
    <ellipse cx="0" cy="0" rx="90" ry="28" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <ellipse cx="0" cy="0" rx="90" ry="28" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
  </g>

  <!-- soft orbs -->
  <circle cx="1600" cy="700" r="120" fill="#c9a227" opacity=".08" filter="url(#blur)"/>
  <circle cx="1350" cy="180" r="80" fill="#e8d48b" opacity=".1" filter="url(#blur)"/>

  <!-- left wireframe pyramid -->
  <g transform="translate(180 620)" opacity=".25" stroke="#e8d48b" fill="none" stroke-width="1.5">
    <path d="M80 0 L160 140 L0 140 Z"/>
    <path d="M80 0 L80 140"/>
    <path d="M0 140 L80 100 L160 140"/>
  </g>

  <!-- abstract layers / filament ribbon -->
  <path d="M-40 900 C300 780 500 980 820 860 C1100 760 1300 920 1600 820 C1750 770 1850 800 1980 760"
        stroke="url(#goldSoft)" stroke-width="28" fill="none" opacity=".35" stroke-linecap="round"/>
  <path d="M-40 960 C320 840 540 1020 860 900 C1120 800 1340 960 1640 880 C1780 840 1880 860 1980 830"
        stroke="#e8d48b" stroke-width="2" fill="none" opacity=".2"/>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="url(#bg)" opacity=".15"/>
  <defs>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
